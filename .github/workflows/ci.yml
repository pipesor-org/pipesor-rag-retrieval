name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: pipesor-org/pipesor-ci/.github/workflows/service-ci.yml@df3b5fc08bc631912ff34be9154aa27776472754 # v1.0.0
    permissions:
      contents: read
      packages: write
    with:
      pip-cache: true
      verify-command: bash tools/ci_verify.sh
