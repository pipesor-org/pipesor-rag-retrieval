name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q src tests tools
      - name: Build and inspect service image
        run: |
          docker build --provenance=false --build-arg "VCS_REF=${GITHUB_SHA}" --tag pipesor-rag-retrieval:quality .
          test "$(docker image inspect pipesor-rag-retrieval:quality --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect pipesor-rag-retrieval:quality --format '{{json .Config.ExposedPorts}}')" = '{"8080/tcp":{}}'
          docker run --rm --entrypoint python pipesor-rag-retrieval:quality -m pip freeze \
            | grep -v '^pipesor-rag-retrieval==' > runtime-requirements.txt
      - name: Generate SBOM and scan runtime dependencies
        run: |
          mkdir -p artifacts
          docker image inspect pipesor-rag-retrieval:quality --format '{{.Id}}' > artifacts/image-digest.txt
          python -m pip_audit --requirement runtime-requirements.txt --format cyclonedx-json --output artifacts/python-sbom.cdx.json
          python -m pip_audit --requirement runtime-requirements.txt --format json --output artifacts/python-vulnerabilities.json
      - name: Upload image assurance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-image-assurance-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Validate pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python tools/validate_contribution.py --message-env PR_TITLE --pr-body-env PR_BODY
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log --format=%s "$BASE_SHA..$HEAD_SHA" | python tools/validate_contribution.py --messages-stdin
      - name: Validate latest main commit
        if: github.event_name == 'push'
        env:
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: python tools/validate_contribution.py --message-env COMMIT_TITLE

