name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/pipesor-org/pipesor-rag-retrieval

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: pipesor
          POSTGRES_PASSWORD: pipesor-test-only
          POSTGRES_DB: pipesor_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipesor -d pipesor_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q src tests tools
      - name: Validate committed OpenAPI contract
        run: |
          python tools/export_openapi.py --output artifacts/internal-v1.json
          python tools/export_openapi.py --check
      - name: Validate offline migration SQL
        run: alembic upgrade head --sql > migration.sql
      - name: Validate PostgreSQL and pgvector integration
        env:
          PIPESOR_RAG_DATABASE_URL: postgresql+psycopg://pipesor:pipesor-test-only@localhost:5432/pipesor_rag
          PIPESOR_RAG_TEST_DATABASE_URL: postgresql+psycopg://pipesor:pipesor-test-only@localhost:5432/pipesor_rag
        run: |
          python -c "import psycopg; connection=psycopg.connect('postgresql://pipesor:pipesor-test-only@localhost:5432/pipesor_rag'); connection.execute('CREATE EXTENSION IF NOT EXISTS vector'); connection.commit()"
          alembic upgrade head
          python -m pytest tests/test_postgres_integration.py
      - name: Build and inspect service image
        run: |
          docker build --provenance=false --build-arg "VCS_REF=${GITHUB_SHA}" --tag pipesor-rag-retrieval:quality .
          test "$(docker image inspect pipesor-rag-retrieval:quality --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect pipesor-rag-retrieval:quality --format '{{json .Config.ExposedPorts}}')" = '{"8080/tcp":{}}'
          docker run --rm --entrypoint python pipesor-rag-retrieval:quality \
            -c "from importlib.metadata import distributions; print(*sorted(d.metadata['Name'] + '==' + d.version for d in distributions() if d.metadata['Name'] != 'pipesor-rag-retrieval'), sep='\n')" \
            > runtime-requirements.txt
          docker run --rm --entrypoint alembic pipesor-rag-retrieval:quality upgrade head --sql > container-migration.sql
      - name: Validate graceful service termination
        run: |
          container_id="$(docker run --detach --publish 18080:8080 \
            --env PIPESOR_ENVIRONMENT=azure \
            --env SERVER_ADDRESS=0.0.0.0 \
            --env SERVER_PORT=8080 \
            --env PIPESOR_RAG_STORAGE_BACKEND=postgresql \
            --env PIPESOR_DATABASE_URL=postgresql+psycopg://rag@app.postgres.database.azure.com/pipesor \
            --env PIPESOR_RAG_EMBEDDING_BACKEND=azure_openai \
            --env PIPESOR_RAG_EMBEDDING_MODEL_VERSION=ci-smoke \
            --env PIPESOR_RAG_AZURE_OPENAI_ENDPOINT=https://ai-pipesor-dev-04f339b7.services.ai.azure.com \
            --env PIPESOR_RAG_AZURE_OPENAI_DEPLOYMENT=pipesor-dev-embeddings \
            --env PIPESOR_RAG_AUTHENTICATION_MODE=platform \
            --env PIPESOR_TENANT_ID=11111111-1111-4111-8111-111111111111 \
            --env PIPESOR_SECURITY_AUDIENCE=urn:pipesor:api:rag \
            --env PIPESOR_SECURITY_TRUSTEDWORKLOADS_0_ID=recommendation \
            --env PIPESOR_SECURITY_TRUSTEDWORKLOADS_0_JWKSURI=https://recommendation.invalid/.well-known/jwks.json \
            --env PIPESOR_SECURITY_TRUSTEDWORKLOADS_0_ROLES=Rag.Query \
            pipesor-rag-retrieval:quality)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null
          docker stop --timeout 60 "$container_id"
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" -eq 0
          docker rm "$container_id"
          trap - EXIT
      - name: Generate SBOM and scan runtime dependencies
        run: |
          mkdir -p artifacts
          python -m pip_audit --requirement runtime-requirements.txt --format cyclonedx-json --output artifacts/python-sbom.cdx.json
          python -m pip_audit --requirement runtime-requirements.txt --format json --output artifacts/python-vulnerabilities.json
      - name: Generate complete image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pipesor-rag-retrieval:quality
          format: cyclonedx
          output: artifacts/image-sbom.cdx.json
          version: v0.76.2
      - name: Record complete image vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pipesor-rag-retrieval:quality
          format: json
          output: artifacts/image-vulnerabilities.json
          scanners: vuln
          version: v0.76.2
      - name: Block every critical image vulnerability
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pipesor-rag-retrieval:quality
          format: table
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: 1
          version: v0.76.2
      - name: Block fixable high image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pipesor-rag-retrieval:quality
          format: table
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: 1
          version: v0.76.2
      - name: Export the verified image
        if: github.event_name == 'push'
        run: |
          docker tag pipesor-rag-retrieval:quality "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker save --output artifacts/rag-image.tar "${IMAGE_NAME}:sha-${GITHUB_SHA}"
      - name: Upload image assurance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-image-assurance-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified image for publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: rag-verified-image-${{ github.sha }}
          path: artifacts/rag-image.tar
          if-no-files-found: error
          retention-days: 1
      - name: Validate pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python tools/validate_contribution.py --message-env PR_TITLE --pr-body-env PR_BODY
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log --format=%s "$BASE_SHA..$HEAD_SHA" | python tools/validate_contribution.py --messages-stdin
      - name: Validate latest main commit
        if: github.event_name == 'push'
        env:
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: python tools/validate_contribution.py --message-env COMMIT_TITLE

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image
        uses: actions/download-artifact@v8
        with:
          name: rag-verified-image-${{ github.sha }}
          path: artifacts
      - name: Load verified image
        run: docker load --input artifacts/rag-image.tar
      - name: Authenticate to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit tag
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
      - name: Resolve and record registry digest
        shell: bash
        run: |
          # shellcheck disable=SC2016
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          printf '%s@%s\n' "$IMAGE_NAME" "$digest" > published-image.txt
          # shellcheck disable=SC2016
          printf 'Published `%s@%s`\n' "$IMAGE_NAME" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility="$(gh api /orgs/pipesor-org/packages/container/pipesor-rag-retrieval --jq .visibility)"
          test "$visibility" = private
      - name: Upload published image identity
        uses: actions/upload-artifact@v7
        with:
          name: rag-published-image-${{ github.sha }}
          path: published-image.txt
          if-no-files-found: error
          retention-days: 90

