[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pipesor-rag-retrieval"
version = "0.1.0"
description = "Authorized contextual knowledge retrieval for Pipesor."
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.4",
  "pgvector==0.5.1",
  "psycopg[binary]==3.3.8",
  "pydantic==2.14.0",
  "SQLAlchemy==2.0.57",
  "uvicorn==0.54.0",
]

[project.scripts]
pipesor-rag-retrieval = "pipesor_rag_retrieval.main:main"
pipesor-rag-import = "pipesor_rag_retrieval.import_cli:main"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipesor_rag_retrieval"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

